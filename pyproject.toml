[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oxide-workflow"
version = "0.2.0"
description = "Oxide surface reactivity MLIP-vs-reference divergence benchmarking prototype"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.27",
    "pymatgen",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
# Only needed to FETCH from Materials Project; cached and local files resolve without it.
mp = ["mp-api"]

[tool.setuptools.packages.find]
include = ["oxide_workflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
